text><text x="39" y="328" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing=".8">PYTHON · PANDAS · MATPLOTLIB · CLI</text><text x="1161" y="328" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="end">EXPLORE →</text><path class="motion" d="M18 359H1182" stroke="#B96C90" stroke-dasharray="45 1200" opacity=".6"><animate attributeName="stroke-dashoffset" from="1200" to="-1200" dur="21s" repeatCount="indefinite"/></path>
