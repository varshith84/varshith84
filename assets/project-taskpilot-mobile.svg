<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">TaskPilot</title><desc id="pv-description">A document assistant that chooses the right tool: retrieve, summarize, or search the web. Source references keep responses grounded. REACT · FASTAPI · LANGGRAPH · FAISS. </desc>
<defs>
<linearGradient id="pv-wine" x2="1" y2="1"><stop stop-color="#23101E"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#771F48"/></linearGradient>
<linearGradient id="pv-soft" x2="1" y2=".7"><stop stop-color="#24101D"/><stop offset="1" stop-color="#140D16"/></linearGradient>
<linearGradient id="pv-stroke"><stop stop-color="#70334F"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#70334F"/></linearGradient>
<radialGradient id="pv-halo"><stop stop-color="#BB477A" stop-opacity=".35"/><stop offset="1" stop-color="#BB477A" stop-opacity="0"/></radialGradient>
<pattern id="pv-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".045"/></pattern>
<clipPath id="pv-portrait"><rect x="0" y="0" width="240" height="288" rx="110"/></clipPath>
</defs>
<style>
@keyframes pv-blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes pv-pulse{0%,100%{opacity:.4}50%{opacity:.95}}
.cursor{animation:pv-blink 1.8s steps(1) infinite}.pulse{animation:pv-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.cursor,.pulse{animation:none}}
</style>
<rect width="600" height="640" fill="#0F0B12"/>
<rect x="1" y="1" width="598" height="638" rx="17" fill="url(#pv-soft)" stroke="#583044" /><text x="30" y="40" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">02 / AGENTIC AI · INFLOW AI</text><text x="28" y="101" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >TaskPilot</text><text x="30" y="162" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >An AI assistant for uploaded documents.</text><text x="30" y="193" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >A LangGraph agent chooses retrieval,</text><text x="30" y="224" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >summarization, or web search,</text><text x="30" y="255" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >with source references in the chat.</text><g transform="translate(371 330) scale(0.78)" opacity=".85"><circle cx="86" cy="40" r="29" fill="#421A30" stroke="#C77B9B"/><circle cx="18" cy="136" r="29" fill="#421A30" stroke="#C77B9B"/><circle cx="155" cy="136" r="29" fill="#421A30" stroke="#C77B9B"/><path d="M69 64 35 111M103 64l35 47M49 136h75" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="86" y="49" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle">AI</text><path d="M7 132h22M7 141h15M145 136h20M155 126v20" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="30" y="321" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="349" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Retrieve</text><rect x="30" y="375" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="403" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Summarize</text><rect x="30" y="429" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="457" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Search</text><path d="M30 528H570" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="566" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".4">REACT · FASTAPI · LANGGRAPH · FAISS</text><text x="30" y="609" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="14" >EXPLORE THE REPOSITORY →</text><path class="motion" d="M18 639H582" stroke="#B96C90" stroke-dasharray="45 600" opacity=".6"><animate attributeName="stroke-dashoffset" from="600" to="-600" dur="21s" repeatCount="indefinite"/></path>
</svg>
