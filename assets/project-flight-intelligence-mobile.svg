<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">Flight Delay Intelligence</title><desc id="pv-description">Turn flight CSVs into useful operations insight: delay metrics, route-risk tables, and rankings. A reusable CLI with charts and automated tests. PYTHON · PANDAS · MATPLOTLIB · CLI. </desc>
<defs>
<linearGradient id="pv-wine" x2="1" y2="1"><stop stop-color="#23101E"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#771F48"/></linearGradient>
<linearGradient id="pv-soft" x2="1" y2=".7"><stop stop-color="#24101D"/><stop offset="1" stop-color="#140D16"/></linearGradient>
<linearGradient id="pv-stroke"><stop stop-color="#70334F"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#70334F"/></linearGradient>
<radialGradient id="pv-halo"><stop stop-color="#BB477A" stop-opacity=".35"/><stop offset="1" stop-color="#BB477A" stop-opacity="0"/></radialGradient>
<pattern id="pv-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".045"/></pattern>
<clipPath id="pv-portrait"><rect x="0" y="0" width="240" height="288" rx="110"/></clipPath>
</defs>
<style>
@keyframes pv-blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes pv-pulse{0%,100%{opacity:.4}50%{opacity:.95}}
.cursor{animation:pv-blink 1.8s steps(1) infinite}.pulse{animation:pv-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.cursor,.pulse{animation:none}}
</style>
<rect width="600" height="700" fill="#0F0B12"/>
<rect x="1" y="1" width="598" height="698" rx="17" fill="url(#pv-soft)" stroke="#583044" /><text x="30" y="40" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">04 / PYTHON · DATA ANALYTICS</text><text x="28" y="101" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >Flight Delay</text><text x="28" y="154" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >Intelligence</text><text x="30" y="217" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >Turn flight CSV files into delay metrics,</text><text x="30" y="248" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >airport and carrier rankings,</text><text x="30" y="279" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >route-risk tables, and charts.</text><text x="30" y="310" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >A reusable CLI with automated tests.</text><g transform="translate(371 385) scale(0.78)" opacity=".85"><path d="M0 155H192M0 155V8" fill="none" stroke="#703C58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M13 135 42 111 70 125 101 70 132 89 173 28" fill="none" stroke="#E5B5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="13" cy="135" r="4" fill="#E5B5C7"/><circle cx="42" cy="111" r="4" fill="#E5B5C7"/><circle cx="70" cy="125" r="4" fill="#E5B5C7"/><circle cx="101" cy="70" r="4" fill="#E5B5C7"/><circle cx="132" cy="89" r="4" fill="#E5B5C7"/><circle cx="173" cy="28" r="4" fill="#E5B5C7"/></g><rect x="30" y="376" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="404" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >CSV input</text><rect x="30" y="430" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="458" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Risk tables</text><rect x="30" y="484" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="512" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >CLI + charts</text><path d="M30 588H570" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="626" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".4">PYTHON · PANDAS · MATPLOTLIB · CLI</text><text x="30" y="669" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="14" >EXPLORE THE REPOSITORY →</text><path class="motion" d="M18 699H582" stroke="#B96C90" stroke-dasharray="45 600" opacity=".6"><animate attributeName="stroke-dashoffset" from="600" to="-600" dur="21s" repeatCount="indefinite"/></path>
