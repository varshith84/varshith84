<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="vf-title">
  <title id="vf-title">Keep learning. Build with care.</title>
  <defs><linearGradient id="vf-bg"><stop stop-color="#10070C"/><stop offset="1" stop-color="#451126"/></linearGradient><linearGradient id="vf-line"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></linearGradient></defs>
  <style>@media(prefers-reduced-motion:reduce){.vf-motion{display:none}}</style>
  <rect width="1200" height="110" rx="16" fill="url(#vf-bg)"/>
  <path d="M45 28H1155" stroke="url(#vf-line)" opacity=".65"/>
  <path class="vf-motion" d="M45 28H1155" stroke="#E5B5C7" stroke-dasharray="30 1080" opacity=".75"><animate attributeName="stroke-dashoffset" from="1110" to="-1110" dur="16s" repeatCount="indefinite"/></path>
  <text x="45" y="73" fill="#F8F0F3" font-family="Georgia,'Times New Roman',serif" font-size="23">Keep learning. Build with care.</text>
  <text x="1155" y="72" text-anchor="end" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">VARSHITH84</text>
</svg>
