<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">AI Medical Assistant</title><desc id="pv-description">Image classification with ResNet-50 and Grad-CAM. Upload an image, explore the visual explanation, and export a report with local scan history. REACT · FASTAPI · PYTORCH · SQLITE. Current source: synthetic Normal / Pneumonia / Tumor demo.</desc>
<defs>
<linearGradient id="pv-wine" x2="1" y2="1"><stop stop-color="#23101E"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#771F48"/></linearGradient>
<linearGradient id="pv-soft" x2="1" y2=".7"><stop stop-color="#24101D"/><stop offset="1" stop-color="#140D16"/></linearGradient>
<linearGradient id="pv-stroke"><stop stop-color="#70334F"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#70334F"/></linearGradient>
<radialGradient id="pv-halo"><stop stop-color="#BB477A" stop-opacity=".35"/><stop offset="1" stop-color="#BB477A" stop-opacity="0"/></radialGradient>
<pattern id="pv-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".045"/></pattern>
<clipPath id="pv-portrait"><rect x="0" y="0" width="240" height="288" rx="110"/></clipPath>
</defs>
<style>
@keyframes pv-blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes pv-pulse{0%,100%{opacity:.4}50%{opacity:.95}}
.cursor{animation:pv-blink 1.8s steps(1) infinite}.pulse{animation:pv-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.cursor,.pulse{animation:none}}
</style>
<rect width="600" height="700" fill="#0F0B12"/>
<rect x="1" y="1" width="598" height="698" rx="17" fill="url(#pv-soft)" stroke="#583044" /><text x="30" y="40" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">03 / BRAIN TUMOR PROJECT · ACADEMIC DEMO</text><text x="28" y="101" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >AI Medical</text><text x="28" y="154" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >Assistant</text><text x="30" y="217" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >Image classification with ResNet-50</text><text x="30" y="248" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >and Grad-CAM visual explanations.</text><text x="30" y="279" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >Includes local scan history, a dashboard,</text><text x="30" y="310" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="22" >PDF reports, and a rule-based chatbot.</text><g transform="translate(371 385) scale(0.78)" opacity=".85"><rect x="6" y="5" width="174" height="161" rx="12" fill="#2B1424" stroke="#583044" /><path d="M25 45V25h23M138 25h23v20M25 127v20h23M138 147h23v-20" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="90" cy="85" rx="49" ry="54" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><ellipse cx="90" cy="85" rx="31" ry="39" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><ellipse cx="90" cy="85" rx="14" ry="24" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><circle class="pulse" cx="111" cy="73" r="14" fill="#D982AB" opacity=".6"/></g><rect x="30" y="376" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="404" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >ResNet-50</text><rect x="30" y="430" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="458" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Grad-CAM</text><rect x="30" y="484" width="275" height="42" rx="8" fill="#38172B" stroke="#583044" /><text x="47" y="512" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >PDF reports</text><path d="M30 588H570" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="626" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".4">REACT · FASTAPI · PYTORCH · SQLITE</text><text x="30" y="669" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="13" >Current source: synthetic Normal / Pneumonia / Tumor demo.</text><path class="motion" d="M18 699H582" stroke="#B96C90" stroke-dasharray="45 600" opacity=".6"><animate attributeName="stroke-dashoffset" from="600" to="-600" dur="21s" repeatCount="indefinite"/></path>
</svg>
