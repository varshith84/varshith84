ont-size="10" letter-spacing="2">BACKEND &amp; APIs</text><text x="48" y="496" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="25" >The engine</text><path d="M48 519H272" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="558" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >Spring Boot · FastAPI</text><text x="48" y="588" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >Flask · REST APIs</text><text x="48" y="618" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >WebSockets</text><rect x="308" y="407" width="264" height="248" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="328" y="445" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2">APPLIED AI</text><text x="328" y="496" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="25" >The intelligence</text><path d="M328 519H552" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="328" y="558" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >PyTorch · RAG</text><text x="328" y="588" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >LangChain · LangGraph</text><text x="328" y="618" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >FAISS · Grad-CAM</text><rect x="28" y="679" width="264" height="248" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="48" y="717" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2">DATA</text><text x="48" y="768" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="25" >The memory</text><path d="M48 791H272" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="830" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="16.5" >MySQL · SQLite</text><text