<text x="40" y="37" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">05 / CREDENTIALS</text><text x="40" y="96" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >Learning, made tangible.</text><rect x="40" y="143" width="550" height="240" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="64" y="176" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">01 / CERTIFICATION</text><text x="64" y="223" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >Microsoft Certified:</text><text x="64" y="257" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >Azure AI Engineer Associate</text><text x="64" y="330" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.3">MICROSOFT</text><text x="64" y="361" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="17" >AI-102 · Azure AI engineering</text><path d="M528 179l9 9 18-22" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="610" y="143" width="550" height="240" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="634" y="176" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">02 / CERTIFICATION</text><text x="634" y="223" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >Salesforce Certified</text><text x="634" y="257" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >AI Associate</text><text x="634" y="330" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.3">SALESFORCE</text><text x="634" y="361" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="17" >Artificial intelligence fundamentals</text><path d="M1098 179l9 9 18-22" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="40" y="409" width="550" height="240" rx="14" fill="u