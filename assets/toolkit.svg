<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">Technical toolkit</title><desc id="pv-description">Technical toolkit</desc>
<defs>
