"#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="820" y="293" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >Spring Boot · FastAPI · Flask</text><text x="820" y="324" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >REST APIs · WebSockets</text><rect x="40" y="384" width="360" height="225" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="60" y="422" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">APPLIED AI</text><text x="60" y="473" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >The intelligence</text><path d="M60 496H380" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="539" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >PyTorch · RAG · LangChain</text><text x="60" y="570" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >LangGraph · FAISS · Grad-CAM</text><rect x="420" y="384" width="360" height="225" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="440" y="422" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">DATA</text><text x="440" y="473" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="29" >The memory</text><path d="M440 496H760" fill="none" stroke="#583044" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="440" y="539" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >MySQL · SQLite</text><text x="440" y="570" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="18" >pandas · Data analysis</text><rect x="800" y="384" width="360" height="225" rx="14" fill="url(#pv-soft)" stroke="#583044" /><text x="820" y="422" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">DEVELOPMENT</text><text x="820" y="473" fill="#F8F0F3" font-family="Georgia,Times,ser