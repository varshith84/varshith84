<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">AI Medical Assistant</title><desc id="pv-description">Image classification with ResNet-50 and Grad-CAM. Upload an image, explore the visual explanation, and export a report with local scan history. REACT · FASTAPI · PYTORCH · SQLITE. Current source: synthetic Normal / Pneumonia / Tumor demo.</desc>
<defs>
<linearGradient id="pv-wine" x2="1" y2="1"><stop stop-color="#23101E"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#771F48"/></linearGradient>
<linearGradient id="pv-soft" x2="1" y2=".7"><stop stop-color="#24101D"/><stop offset="1" stop-color="#140D16"/></linearGradient>
<linearGradient id="pv-stroke"><stop stop-color="#70334F"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#70334F"/></linearGradient>
<radialGradient id="pv-halo"><stop stop-color="#BB477A" stop-opacity=".35"/><stop offset="1" stop-color="#BB477A" stop-opacity="0"/></radialGradient>
<pattern id="pv-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".045"/></pattern>
<clipPath id="pv-portrait"><rect x="0" y="0" width="240" height="288" rx="110"/></clipPath>
</defs>
<style>
@keyframes pv-blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes pv-pulse{0%,100%{opacity:.4}50%{opacity:.95}}
.cursor{animation:pv-blink 1.8s steps(1) infinite}.pulse{animation:pv-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.motion{display:none}.cursor,.pulse{animation:none}}
</style>
<rect width="1200" height="360" fill="#0F0B12"/>
<rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#pv-soft)" stroke="#583044" /><text x="38" y="40" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">03 / BRAIN TUMOR PROJECT · ACADEMIC DEMO</text><text x="36" y="105" fill="#F8F0F3" font-family="Georgia,Times,serif" font-size="46" >AI Medical Assistant</text><text x="39" y="152" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="21" >Image classification with ResNet-50 and Grad-CAM.</text><text x="39" y="181" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="21" >Upload an image, explore the visual explanation,</text><text x="39" y="210" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="21" >and export a report with local scan history.</text><g transform="translate(946 72) scale(1)" opacity=".85"><rect x="6" y="5" width="174" height="161" rx="12" fill="#2B1424" stroke="#583044" /><path d="M25 45V25h23M138 25h23v20M25 127v20h23M138 147h23v-20" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="90" cy="85" rx="49" ry="54" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><ellipse cx="90" cy="85" rx="31" ry="39" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><ellipse cx="90" cy="85" rx="14" ry="24" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><circle class="pulse" cx="111" cy="73" r="14" fill="#D982AB" opacity=".6"/></g><rect x="38" y="242" width="248" height="48" rx="8" fill="#39182C" stroke="#583044" /><text x="55" y="273" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >ResNet-50</text><rect x="302" y="242" width="248" height="48" rx="8" fill="#39182C" stroke="#583044" /><text x="319" y="273" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >Grad-CAM</text><rect x="566" y="242" width="248" height="48" rx="8" fill="#39182C" stroke="#583044" /><text x="583" y="273" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="18" >PDF reports</text><text x="39" y="328" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing=".8">REACT · FASTAPI · PYTORCH · SQLITE</text><text x="1161" y="328" fill="#E5B5C7" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="end">EXPLORE →</text><text x="905" y="295" fill="#B79BAA" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1">SYNTHETIC DATA DEMO</text><path class="motion" d="M18 359H1182" stroke="#B96C90" stroke-dasharray="45 1200" opacity=".6"><animate attributeName="stroke-dashoffset" from="1200" to="-1200" dur="21s" repeatCount="indefinite"/></path>
</svg>
