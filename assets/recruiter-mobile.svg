<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="445" viewBox="0 0 600 445" role="img" aria-labelledby="pv-title pv-description">
<title id="pv-title">Recruiter quick scan — choose a full-stack, applied AI, or Python and data code tour</title><desc id="pv-description">Recruiter quick scan — choose a full-stack, applied AI, or Python and data code tour</desc>
<defs>
